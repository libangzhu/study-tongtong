<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>三年级上册 · 数学 · 第一单元</title>
<style>
  :root {
    --desk: #e6d8c2;
    --paper: #fffaf2;
    --ink: #241c16;
    --muted: #6f6256;
    --red: #d23b3b;
    --green: #1d7a46;
    --blue: #2a6f97;
    --gold: #e2a21a;
    --orange: #ef8a34;
    --line: #f0e2cc;
    --soft: #fff4e0;
    --shadow: 0 16px 40px rgba(70, 46, 20, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Songti SC", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,.45), transparent 28%),
      linear-gradient(180deg, #f3e7d2, var(--desk));
    min-height: 100%;
  }
  button, input { font-family: inherit; }
  .app {
    max-width: 1120px;
    margin: 0 auto;
    padding: 22px 18px 40px;
  }
  header.top {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-end;
    margin-bottom: 14px;
  }
  .crumb { margin: 0 0 4px; font-size: 14px; }
  .crumb a { color: var(--red); font-weight: 700; text-decoration: none; }
  .level-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .level-nav button {
    border: 0; background: #efe4d2; color: var(--ink);
    border-radius: 999px; padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .level-nav button:disabled { opacity: .4; cursor: default; }
  .level-nav kbd {
    font-family: inherit; font-size: 12px;
    border: 1px solid #ddcbb3; border-radius: 6px; padding: 0 5px; margin-left: 4px;
  }
  header.top h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 0.02em;
  }
  header.top .dots { display: none; }
  header.top p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  .book {
    background: var(--paper);
    border-radius: 18px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    min-height: 680px;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }
  .book::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 18px;
    background: repeating-linear-gradient(
      180deg,
      #e25a52 0 10px,
      #c8443c 10px 12px
    );
  }
  .nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 16px 22px 8px 36px;
  }
  .nav button {
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 14px;
  }
  .nav button.on {
    background: #241c16;
    color: #fffaf2;
  }
  .spread {
    display: grid;
    grid-template-columns: 1.35fr 0.85fr;
    gap: 8px;
    padding: 6px 22px 12px 36px;
    min-height: 460px;
  }
  .stage-wrap { min-width: 0; }
  .stage {
    position: relative;
    background:
      linear-gradient(#f7efe2, #f7efe2) 0 0 / 100% 28px,
      repeating-linear-gradient(180deg, transparent 0 27px, rgba(226,90,82,.18) 27px 28px);
    background-color: #fffdf8;
    border: 1px solid var(--line);
    border-radius: 14px;
    min-height: 440px;
    overflow: auto;
  }
  .scene { position: relative; min-height: 440px; }
  .say {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .kicker {
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--red);
    font-weight: 700;
  }
  .say h2 { margin: 0; font-size: 22px; line-height: 1.35; }
  .ask {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
  }
  .bubble {
    background: var(--soft);
    border-radius: 12px;
    padding: 12px 14px;
    line-height: 1.65;
    font-size: 17px;
    min-height: 92px;
  }
  .formula {
    font-variant-numeric: tabular-nums;
    font-weight: 750;
    font-size: 22px;
    color: var(--blue);
    min-height: 32px;
  }
  .formula .bad { color: var(--red); text-decoration: line-through; font-weight: 650; font-size: 16px; margin-right: 8px; }
  .tag {
    display: inline-block;
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 12px;
    font-weight: 700;
    vertical-align: 2px;
  }
  .tag.ok { background: #e5f6eb; color: var(--green); }
  .tag.fix { background: #fde8e6; color: var(--red); }
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 22px 18px 36px;
  }
  .controls button, .ghost {
    border: 0;
    background: var(--ink);
    color: white;
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 16px;
    cursor: pointer;
  }
  .controls button.secondary, .ghost.secondary {
    background: #efe4d2;
    color: var(--ink);
  }
  .controls button:disabled { opacity: .35; cursor: default; }
  .steps { margin-left: auto; color: var(--muted); font-size: 14px; }
  .dots { display: flex; gap: 6px; }
  .dots i {
    width: 8px; height: 8px; border-radius: 50%;
    background: #e4d5bf; display: block;
  }
  .dots i.on { background: var(--red); }

  .scene .bit { display: none; }
  .scene .bit.on { display: block; }
  .scene .bit.on.slider-row,
  .scene .bit.on.match { display: flex; }
  .abs { position: absolute; }
  .fade.on { animation: rise .45s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* shared drawings */
  svg.ill { width: 100%; height: 440px; display: block; }
  .fruit {
    position: absolute;
    width: 14px; height: 14px;
    margin-left: -7px; margin-top: -7px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffd0c8, #e15a48 62%, #b9362c);
    left: var(--bx); top: var(--by);
    transition: left .7s cubic-bezier(.2,.7,.2,1), top .7s cubic-bezier(.2,.7,.2,1);
    box-shadow: inset -2px -2px 0 rgba(0,0,0,.08);
    z-index: 2;
  }
  .basket {
    position: absolute;
    left: 24%; right: 24%; top: 28px; height: 168px;
    background: #f3d7a4;
    clip-path: polygon(12% 0, 88% 0, 100% 100%, 0 100%);
    display: flex; justify-content: center; align-items: flex-start;
    padding-top: 10px; font-size: 26px; font-weight: 800;
  }
  .dish {
    position: absolute; top: 318px; width: 21%; height: 34px;
    border: 3px solid #241c16; border-radius: 0 0 46px 46px;
    background: #fff;
  }
  .dish .plate-label {
    position: absolute; left: 0; right: 0; top: 36px;
    text-align: center; color: var(--green);
  }
  .scene[data-step="1"] .fruit,
  .scene[data-step="2"] .fruit,
  .scene[data-step="3"] .fruit { left: var(--px); top: var(--py); }
  .plate-label, .float-note {
    position: absolute;
    font-weight: 750;
    color: var(--green);
  }
  .cross {
    position: absolute;
    color: var(--red);
    font-weight: 800;
    font-size: 28px;
    transform: rotate(-8deg);
  }

  .ruler-box { padding: 28px 22px 10px; }
  .ruler {
    position: relative;
    height: 92px;
    border: 2px solid var(--ink);
    border-radius: 8px;
    background: linear-gradient(#fff, #f6efe4);
    margin-top: 70px;
  }
  .ruler .tick {
    position: absolute; bottom: 0; width: 2px; background: var(--ink);
  }
  .ruler .tick.cm { height: 38px; width: 3px; }
  .ruler .tick.half { height: 24px; }
  .ruler .tick.mm { height: 12px; background: #8a7b6b; width: 1px; }
  .ruler .num {
    position: absolute; top: 8px; transform: translateX(-50%);
    font-size: 13px; font-weight: 700;
  }
  .pen-line {
    position: absolute;
    left: 0; bottom: 42px;
    height: 8px;
    background: #2a6f97;
    border-radius: 8px;
    width: 0;
    z-index: 2;
  }
  .mark-57 {
    position: absolute; bottom: 0; width: 0; height: 0;
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-bottom: 9px solid var(--red);
    transform: translateX(-6px);
    left: calc(57 / 80 * 100%);
  }
  .slider-row { margin-top: 54px; display: flex; align-items: center; gap: 12px; }
  input[type="range"] { flex: 1; accent-color: var(--blue); }
  .readout { font-size: 22px; font-weight: 800; min-width: 148px; color: var(--blue); }

  .track { position: relative; height: 100%; }
  .lane {
    position: absolute; left: 8%; right: 8%; height: 70px;
  }
  .lane .ground {
    position: absolute; left: 0; right: 0; bottom: 8px; height: 4px; background: #e4d3b8; border-radius: 4px;
  }
  .mover { position: absolute; bottom: 12px; left: 0; transition: left 1.6s cubic-bezier(.16,.8,.2,1); }
  .scene[data-step="0"] .mover { left: 0; }
  .scene[data-step="1"] .bike, .scene[data-step="2"] .bike, .scene[data-step="3"] .bike { left: calc(48 / 170 * 78%); }
  .scene[data-step="1"] .car, .scene[data-step="2"] .car, .scene[data-step="3"] .car { left: calc(75 / 170 * 78%); }
  .scene[data-step="1"] .heli, .scene[data-step="2"] .heli, .scene[data-step="3"] .heli { left: 78%; }
  .rotor { transform-origin: 48px 10px; animation: spin .45s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .match { display: flex; justify-content: space-between; padding: 24px 28px; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 18px; width: 42%; }
  .choice, .speed {
    border: 2px solid #eadcc6;
    background: #fff;
    border-radius: 12px;
    padding: 10px 12px;
    cursor: pointer;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
  }
  .choice.pick, .speed.pick { border-color: var(--blue); background: #eef6fb; }
  .choice.good, .speed.good { border-color: var(--green); background: #e9f8ef; }
  .choice.bad, .speed.bad { border-color: var(--red); background: #fdeeee; }

  .stack { position: relative; height: 440px; }
  .book-item {
    position: absolute; left: 70px; height: 30px; width: 210px;
    border: 2px solid #2a6f97; border-radius: 3px;
    background: linear-gradient(90deg, #8ec3e0, #d7eef8 14%, #f7fbfe 14% 100%);
    transform: translateY(24px);
    opacity: 0;
  }
  .scene[data-step="2"] .book-item,
  .scene[data-step="3"] .book-item { opacity: 1; transform: translateY(0); transition: .45s ease; }
  .mm-ruler {
    position: absolute; right: 36px; top: 40px; bottom: 36px; width: 74px;
    border-left: 3px solid var(--ink);
  }

  .pencil-scene { height: 440px; position: relative; }
  .pencil {
    position: absolute; top: 150px; height: 46px; border-radius: 6px;
    display: flex; overflow: hidden; border: 2px solid #241c16;
  }
  .used { background: repeating-linear-gradient(90deg, #d9d1c6, #d9d1c6 10px, #cfc6b8 10px 12px); }
  .left { background: linear-gradient(#ffe27a, #f0b429); }
  .wood { width: 22px; background: linear-gradient(90deg, #f3d2a4, #c9844a); clip-path: polygon(0 0, 100% 50%, 0 100%); }
  .scene[data-step="0"] .pencil { left: 80px; width: 360px; }
  .scene[data-step="1"] .used { width: 148px; }
  .scene[data-step="1"] .left { width: 184px; }
  .join .used, .join .left { transition: width .6s ease; }

  .road { position: relative; height: 440px; }
  .hand {
    transform-box: view-box;
    transform-origin: 14.0625% 20.4545%;
    transition: transform 1.1s ease;
  }
  .scene[data-step="0"] .hour { transform: rotate(240deg); }
  .scene[data-step="1"] .hour,
  .scene[data-step="2"] .hour,
  .scene[data-step="3"] .hour,
  .scene[data-step="4"] .hour { transform: rotate(300deg); }

  .car-move { transition: left 1.5s ease; }
  .scene[data-step="0"] .car-move,
  .scene[data-step="1"] .car-move { left: 70px; }
  .scene[data-step="2"] .car-move,
  .scene[data-step="3"] .car-move,
  .scene[data-step="4"] .car-move { left: 72%; }

  .rods { position: relative; height: 286px; margin: 18px 32px 0; }
  .stick {
    position: absolute; height: 46px; width: 50%; border-radius: 12px;
    display: flex; overflow: hidden; color: #fff; font-weight: 800; font-size: 15px;
    z-index: 1;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.4);
    transition: left .7s ease, top .7s ease;
  }
  .stick.a { background: #3d8fd1; left: 0; top: 58px; }
  .stick.b { background: #ef8a34; left: 40%; top: 154px; }
  .stick .seg { display: flex; align-items: center; justify-content: center; height: 100%; white-space: nowrap; }
  .stick .s8 { flex: 8; }
  .stick .s2 {
    flex: 2;
    background: rgba(210, 59, 59, .22);
    box-shadow: inset 0 0 0 3px #d23b3b;
  }
  .stick .all { display: none; }
  .overlap-col {
    position: absolute; top: 28px; height: 196px;
    left: calc(40% - 3px); width: calc(10% + 6px);
    border: 3px solid #d23b3b; border-radius: 12px;
    z-index: 3; pointer-events: none;
  }
  .overlap-col span {
    position: absolute; left: 50%; top: -6px; transform: translate(-50%, -100%);
    color: #d23b3b; font-weight: 800; font-size: 16px; white-space: nowrap;
  }
  .overlap-note {
    position: absolute; left: 45%; top: 118px; transform: translateX(-50%);
    z-index: 4; color: #d23b3b; font-weight: 800; font-size: 15px;
    white-space: nowrap; background: #fffdf8; padding: 2px 6px;
  }
  .brace {
    position: absolute; top: 232px; height: 36px;
    border-top: 2px solid #241c16; text-align: center;
    font-weight: 800; font-size: 16px; padding-top: 8px;
  }
  .brace::before, .brace::after {
    content: ""; position: absolute; top: -8px; width: 2px; height: 14px; background: #241c16;
  }
  .brace::before { left: 0; }
  .brace::after { right: 0; }
  .brace.b18 { left: 0; width: 90%; }
  .brace.b20 { left: 0; width: 100%; color: #1d7a46; border-color: #1d7a46; }
  .brace.b20::before, .brace.b20::after { background: #1d7a46; }
  .scene.apart .stick.a { left: 0; top: 106px; }
  .scene.apart .stick.b { left: 50%; top: 106px; }
  .scene.apart .stick .s8,
  .scene.apart .stick .s2 { display: none; }
  .scene.apart .stick .all { display: flex; flex: 1; }

  .loop {
    transform-origin: 180px 150px;
    opacity: 0;
  }
  .scene[data-step="1"] .loop.l1,
  .scene[data-step="2"] .loop.l1,
  .scene[data-step="3"] .loop.l1,
  .scene[data-step="4"] .loop.l1 { opacity: 1; }
  .scene[data-step="2"] .loop.l2,
  .scene[data-step="3"] .loop.l2,
  .scene[data-step="4"] .loop.l2,
  .scene[data-step="2"] .loop.l3,
  .scene[data-step="3"] .loop.l3,
  .scene[data-step="4"] .loop.l3,
  .scene[data-step="2"] .loop.l4,
  .scene[data-step="3"] .loop.l4,
  .scene[data-step="4"] .loop.l4 { opacity: 1; }
  .scene[data-step="1"] .loop { transition: opacity .3s linear; }
  .tail { opacity: 0; }
  .scene[data-step="3"] .tail,
  .scene[data-step="4"] .tail { opacity: 1; }

  .cells rect { fill: #fff; stroke: #241c16; stroke-width: 2; }
  .scene[data-step="3"] .up-cell,
  .scene[data-step="4"] .up-cell,
  .scene[data-step="5"] .up-cell { fill: #fff3c4; }
  .scene[data-step="4"] .down-cell,
  .scene[data-step="5"] .down-cell { fill: #e7f6ee; }
  .cell-num { opacity: 0; font-weight: 800; font-size: 18px; }
  .scene[data-step="3"] .up-num,
  .scene[data-step="4"] .up-num,
  .scene[data-step="5"] .up-num,
  .scene[data-step="4"] .down-num,
  .scene[data-step="5"] .down-num { opacity: 1; }

  .sum-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 22px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .card b { display: block; margin-bottom: 6px; }
  .ladder { display: flex; flex-direction: column; gap: 8px; padding: 20px 24px; }
  .rung {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 10px; padding: 8px 12px;
    border: 1px solid var(--line); font-weight: 700;
  }
  @media (max-width: 860px) {
    .spread { grid-template-columns: 1fr; }
    header.top { flex-direction: column; align-items: flex-start; }
    .stage, svg.ill, .stack, .pencil-scene, .road { min-height: 380px; height: 380px; }
    svg.ill { height: 380px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body data-home="../../../index.html" data-up="../index.html">
<div class="app">
  <header class="top">
    <div>
      <p class="crumb"><a href="../../../index.html">三年级上册</a> · <a href="../index.html">数学</a></p>
      <h1>第一单元</h1>
      <p>看图列式、画线段、单位换算。一步一步看，为什么要这样算。</p>
    </div>
    <div id="levelNav"></div>
  </header>
  <div class="book">
    <nav class="nav" id="nav"></nav>
    <div class="spread">
      <div class="stage-wrap">
        <div class="stage" id="stage"></div>
      </div>
      <aside class="say">
        <div class="kicker" id="kicker"></div>
        <h2 id="title"></h2>
        <p class="ask" id="ask"></p>
        <div class="bubble" id="bubble"></div>
        <div class="formula" id="formula"></div>
      </aside>
    </div>
    <div class="controls">
      <button type="button" id="prev" class="secondary">上一步</button>
      <button type="button" id="next">下一步</button>
      <button type="button" id="auto" class="secondary">自动播放</button>
      <div class="steps" id="stepLabel"></div>
      <div class="dots" id="dots" aria-hidden="true"></div>
    </div>
  </div>
</div>
<script>
const scenes = [];

function fruitsHTML() {
  let html = "";
  for (let i = 0; i < 36; i++) {
    const col = i % 6;
    const row = Math.floor(i / 6);
    const bx = 32 + col * 6;
    const by = 18 + row * 4.2;
    const plate = Math.floor(i / 9);
    const k = i % 9;
    const px = 14.5 + plate * 24 + (k % 3 - 1) * 4.4;
    const py = 74 + Math.floor(k / 3) * 3.4;
    html += `<i class="fruit" style="--bx:${bx}%;--by:${by}%;--px:${px}%;--py:${py}%"></i>`;
  }
  return html;
}

scenes.push({
  id: "home",
  nav: "开始",
  kicker: "数学 · 第一单元",
  title: "第一单元",
  ask: "这一单元先放这些题。点题号开始，或按「下一步」。",
  steps: [
    { say: "有的题，得数碰巧对了，可是算式里写了图上没有的数。有的题，算法是对的，单位和答句要写完整。", formula: "图上有的数，才能写进算式" }
  ],
  stage() {
    const items = [
      ["22①", "36个分到4个盘"],
      ["22②", "线段图，先求1格"],
      ["23", "5厘米7毫米"],
      ["24", "谁一小时走得远"],
      ["25", "书摞到4厘米"],
      ["26", "铅笔原来多长"],
      ["27", "10点前能到吗"],
      ["28", "绳子绕了4圈"],
      ["29", "木棒重叠2厘米"]
    ];
    return `<div class="sum-grid">${items.map((it, i) =>
      `<button class="card" data-jump="${i + 1}" style="text-align:left;cursor:pointer;font-size:16px"><b>第 ${it[0]} 题</b>${it[1]}</button>`
    ).join("")}</div>`;
  }
});

scenes.push({
  id: "q22a",
  nav: "22①",
  kicker: "第22题（1） · 平均分",
  title: "每盘放几个？",
  ask: "篮子里有 36 个，旁边 4 个盘子。平均分，每盘放几个？",
  mark: "fix",
  steps: [
    { say: "先看图上到底有哪些数：一个篮子，36个；四个空盘子。问的是每盘几个。", formula: "图上的数：36 个，4 盘" },
    { say: "平均分，就是四个盘子一样多。36个一个一个分进去，每个盘子分到 9 个。", formula: "36 ÷ 4 = 9（个）" },
    { say: "每盘都是 9 个。列式就写 36÷4=9（个）。单位是「个」，因为问的是放几个，不是多少元。", formula: "36 ÷ 4 = 9（个）" },

    { say: "点「拉开」。两根接成一条，叠住的 2 厘米露出来了。总长要加上它：18+2=20 厘米。每根都是 10 厘米。", formula: "18 + 2 = 20（厘米）" },
    { say: "20厘米换成以分米作单位。1分米=10厘米，20厘米=2分米。", formula: "20厘米 = 2分米" },
    { say: "也可以再检查：两根一共 20 厘米，同样长，每根 20÷2=10厘米。10+10=20，和刚才一样。", formula: "答：20厘米，合2分米" }
  ],
  stage() {
    return `<div class="scene" id="stickScene">
      <div class="rods">
        <div class="stick a"><span class="seg s8">8厘米</span><span class="seg s2">2</span><span class="seg all">10厘米</span></div>
        <div class="stick b"><span class="seg s2">2</span><span class="seg s8">8厘米</span><span class="seg all">10厘米</span></div>
        <div class="overlap-col bit" data-only="0"><span>重叠 2厘米</span></div>
        <div class="overlap-note bit" data-only="0">这两段叠在一起</div>
        <div class="brace b18 bit" data-only="0">外面量到 18厘米</div>
        <div class="brace b20 bit" data-at="1">拉开后一共 20厘米</div>
      </div>
      <div style="text-align:center;margin-top:8px">
        <button type="button" class="ghost" id="pullBtn">拉开</button>
      </div>
      <div class="bit" data-at="2" style="text-align:center;font-size:22px;font-weight:800;color:#2a6f97">20厘米 = 2分米</div>
    </div>`;
  }
});

scenes.push({
  id: "end",
  nav: "小结",
  kicker: "记住这三句",
  title: "下次写在试卷上",
  ask: "算法对了，还要把单位和答句写完整。",
  steps: [
    { say: "第一，图上没有的数，不要写进算式。第二，单位不一样，先换算。第三，问「能不能、多少」，最后用一句话答。", formula: "看图 · 换单位 · 写答句" }
  ],
  stage() {
    return `<div class="sum-grid" style="padding:16px">
      <div class="card"><b>1厘米 = 10毫米</b>1分米 = 10厘米<br>1千米 = 1000米</div>
      <div class="card"><b>22①</b>36÷4=9（个）</div>
      <div class="card"><b>22②</b>4÷4×6=6（元）</div>
      <div class="card"><b>23</b>5厘米7毫米 = 57毫米</div>
      <div class="card"><b>24</b>自行车48，汽车75，直升机170</div>
      <div class="card"><b>25</b>4厘米=40毫米，40÷8=5本</div>
      <div class="card"><b>26</b>8+10=18厘米=180毫米</div>
      <div class="card"><b>27</b>120＞110，能到</div>
      <div class="card"><b>28</b>9×4+4=40厘米=4分米</div>
      <div class="card"><b>29</b>18+2=20厘米=2分米</div>
    </div>`;
  }
});

const rightMatch = { bike: "48", car: "75", heli: "170" };
let sceneIndex = 0;
let stepIndex = 0;
let timer = null;
let pickWho = null;

const stageEl = document.getElementById("stage");
const navEl = document.getElementById("nav");
const dotsEl = document.getElementById("dots");

function stopAuto() {
  if (timer) { clearInterval(timer); timer = null; }
  document.getElementById("auto").textContent = "自动播放";
}

function renderNav() {
  navEl.innerHTML = scenes.map((s, i) =>
    `<button type="button" data-go="${i}" class="${i===sceneIndex?"on":""}">${s.nav}</button>`
  ).join("");
}

function renderScene() {
  const s = scenes[sceneIndex];
  stageEl.innerHTML = s.stage();
  document.getElementById("kicker").innerHTML = `${s.kicker}${s.mark ? ` <span class="tag ${s.mark}">${s.mark==="ok"?"算法可以这样写":"这里改一改"}</span>` : ""}`;
  document.getElementById("title").textContent = s.title;
  document.getElementById("ask").textContent = s.ask;
  dotsEl.innerHTML = s.steps.map((_, i) => `<i class="${i===stepIndex?"on":""}"></i>`).join("");
  applyStep();
  renderNav();
  const range = document.getElementById("rulerRange");
  if (range) {
    range.addEventListener("input", () => updateRuler(Number(range.value)));
    updateRuler(0);
  }
}

function applyStep() {
  const s = scenes[sceneIndex];
  const step = Math.max(0, Math.min(stepIndex, s.steps.length - 1));
  stepIndex = step;
  const root = stageEl.querySelector(".scene") || stageEl;
  root.dataset.step = String(step);
  root.querySelectorAll("[data-at]").forEach(el => {
    el.classList.toggle("on", Number(el.dataset.at) <= step);
  });
  root.querySelectorAll("[data-only]").forEach(el => {
    el.classList.toggle("on", Number(el.dataset.only) === step);
  });
  const info = s.steps[step];
  document.getElementById("bubble").textContent = info.say;
  document.getElementById("formula").innerHTML = info.formula || "";
  document.getElementById("stepLabel").textContent = `第 ${step + 1} / ${s.steps.length} 步`;
  document.getElementById("prev").disabled = sceneIndex === 0 && step === 0;
  document.getElementById("next").textContent = (step === s.steps.length - 1) ? (sceneIndex === scenes.length - 1 ? "完成" : "下一题") : "下一步";
  dotsEl.innerHTML = s.steps.map((_, i) => `<i class="${i===step?"on":""}"></i>`).join("");
  const sticks = document.getElementById("stickScene");
  if (sticks) sticks.classList.toggle("apart", step >= 1);
  if (s.id === "q23") {
    const line = document.getElementById("penLine");
    const range = document.getElementById("rulerRange");
    if (line && step === 3) {
      line.style.width = "0";
      requestAnimationFrame(() => { line.style.width = "71.25%"; });
    }
    if (line && range && step === 4 && range.value === "0") {
      line.style.width = "0%";
    }
  }
}

function updateRuler(mm) {
  const line = document.getElementById("penLine");
  const readout = document.getElementById("readout");
  if (!line || !readout) return;
  line.style.width = `${(mm / 80) * 100}%`;
  const cm = Math.floor(mm / 10);
  const rest = mm % 10;
  readout.textContent = rest === 0 ? `${cm}厘米` : `${cm}厘米${rest}毫米`;
  readout.style.color = mm === 57 ? "#1d7a46" : "#2a6f97";
  if (mm === 57) readout.textContent = "5厘米7毫米 ✓";
}

function goStep(delta) {
  const s = scenes[sceneIndex];
  const next = stepIndex + delta;
  if (next >= 0 && next < s.steps.length) {
    stepIndex = next;
    applyStep();
    return;
  }
  if (delta > 0 && sceneIndex < scenes.length - 1) {
    sceneIndex += 1;
    stepIndex = 0;
    renderScene();
  } else if (delta < 0 && sceneIndex > 0) {
    sceneIndex -= 1;
    stepIndex = scenes[sceneIndex].steps.length - 1;
    renderScene();
  }
}

document.getElementById("next").addEventListener("click", () => { stopAuto(); goStep(1); });
document.getElementById("prev").addEventListener("click", () => { stopAuto(); goStep(-1); });
document.getElementById("auto").addEventListener("click", () => {
  if (timer) { stopAuto(); return; }
  document.getElementById("auto").textContent = "暂停";
  timer = setInterval(() => {
    const s = scenes[sceneIndex];
    if (stepIndex < s.steps.length - 1) goStep(1);
    else if (sceneIndex < scenes.length - 1) goStep(1);
    else stopAuto();
  }, 2600);
});

document.body.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go) {
    stopAuto();
    sceneIndex = Number(go.dataset.go);
    stepIndex = 0;
    renderScene();
    return;
  }
  const jump = e.target.closest("[data-jump]");
  if (jump) {
    stopAuto();
    sceneIndex = Number(jump.dataset.jump);
    stepIndex = 0;
    renderScene();
    return;
  }
  if (e.target.id === "pullBtn") {
    document.getElementById("stickScene").classList.add("apart");
    if (stepIndex < 1) { stepIndex = 1; applyStep(); }
  }
  const who = e.target.closest("[data-who]");
  const spd = e.target.closest("[data-spd]");
  if (who) {
    document.querySelectorAll(".choice").forEach(n => n.classList.remove("pick"));
    who.classList.add("pick");
    pickWho = who.dataset.who;
  }
  if (spd && pickWho) {
    const ok = rightMatch[pickWho] === spd.dataset.spd;
    const whoBtn = document.querySelector(`.choice[data-who="${pickWho}"]`);
    whoBtn.classList.remove("pick");
    whoBtn.classList.add(ok ? "good" : "bad");
    spd.classList.add(ok ? "good" : "bad");
    if (!ok) {
      setTimeout(() => {
        whoBtn.classList.remove("bad");
        spd.classList.remove("bad");
      }, 700);
    }
    pickWho = null;
  }
});

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target && e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  if (e.key === "ArrowRight") { stopAuto(); goStep(1); }
  if (e.key === "ArrowLeft") { stopAuto(); goStep(-1); }
});

window.onLevelUp = function () {
  if (sceneIndex > 0) {
    stopAuto();
    sceneIndex = 0;
    stepIndex = 0;
    renderScene();
    return true;
  }
  stopAuto();
  return false;
};

renderScene();
</script>
<script src="../../../level.js"></script>
</body>
</html>
